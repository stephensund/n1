name: Build ImmortalWrt-25.12 for N1-TEST

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Free up space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Add swap
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update > /dev/null
          sudo -E apt-get -qq install -y $(curl -fsSL https://raw.githubusercontent.com/nantayo/My-Pkg/master/2410) > /dev/null
          sudo -E apt-get -qq install -y libncurses-dev > /dev/null
          sudo -E apt-get -qq autoremove --purge > /dev/null
          sudo -E apt-get -qq clean > /dev/null
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --depth=1 openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Update & Install feeds
        run: |
          chmod +x diy.sh
          cd openwrt
          ./scripts/feeds update -a
          $GITHUB_WORKSPACE/diy.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load N1 custom config
        run: |
          rm -rf openwrt/files openwrt/.config
          mv files .config openwrt/

      - name: SSH connect to Actions
        uses: P3TERX/ssh2actions@main
        if: github.event.inputs.ssh == 'true'

      - name: Download package
        working-directory: ./openwrt
        run: |
          make defconfig
          make download -j$(( $(nproc) * 2 ))
          find dl -size -1k -exec rm -f {} \;

      - name: Compile N1 firmware
        run: |
          chmod -R 755 openwrt
          cd openwrt
          echo "Use 1 thread for stable build"
          make -j2 --quiet

      - name: Inject Mihomo + GEO (into rootfs)
        run: |
          # 1. 找到并保存原始 rootfs 路径
          ORIGINAL_ROOTFS=$(ls -1 openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz | head -n 1)
          echo "Original ROOTFS: $ORIGINAL_ROOTFS"
          
          # 创建临时目录用于修改
          rm -rf rootfs_work
          mkdir -p rootfs_work
          tar -xzf "$ORIGINAL_ROOTFS" -C rootfs_work

          # 创建必要的目录（修复：添加这些目录的创建）
          mkdir -p mihomo_core
          mkdir -p geo_files

          # 2. 获取最新 Mihomo 版本
          TAG=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep tag_name | sed 's/.*"tag_name": "\(.*\)".*/\1/')
          echo "Latest Mihomo tag: $TAG"

          CORE_URL="https://github.com/MetaCubeX/mihomo/releases/download/${TAG}/mihomo-linux-arm64-${TAG}.gz"
          
          echo "Downloading Mihomo ARM64 core..."
          curl -sL "$CORE_URL" | gunzip > mihomo_core/mihomo
          chmod +x mihomo_core/mihomo

          # 3. 下载 GEO 文件
          curl -sL "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/geoip.dat" -o geo_files/geoip.dat
          curl -sL "https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geosite.dat" -o geo_files/geosite.dat

          # 4. 安装到正确位置 (OpenClash 标准路径)
          mkdir -p rootfs_work/usr/share/openclash/core
          
          # 安装核心
          cp -f mihomo_core/mihomo rootfs_work/usr/share/openclash/core/clash_meta
          chmod +x rootfs_work/usr/share/openclash/core/clash_meta
          
          # 安装 GEO 文件
          cp -f geo_files/geoip.dat rootfs_work/usr/share/openclash/geoip.dat
          cp -f geo_files/geosite.dat rootfs_work/usr/share/openclash/geosite.dat
          
          # 软链接到 /etc/openclash (OpenClash 也会读取这里)
          mkdir -p rootfs_work/etc/openclash
          ln -sf ../usr/share/openclash/geoip.dat rootfs_work/etc/openclash/geoip.dat
          ln -sf ../usr/share/openclash/geosite.dat rootfs_work/etc/openclash/geosite.dat
          ln -sf ../../usr/share/openclash/core/clash_meta rootfs_work/etc/openclash/core/clash_meta

          # 5. 创建 OpenClash 配置
          mkdir -p rootfs_work/etc/config
          cat > rootfs_work/etc/config/openclash << 'EOF'
          config openclash 'config'
              option enable '0'
              option dev_mode 'false'
              option dns_port '1053'
              option ipv6 'false'
              option ipv6_dns '0'
              option routing_indication '0'
              option redirect_dns '1'
              option resolution_mod '0'
              option cheap_level '0'
              option auto_update 'true'
              option auto_restart 'true'
              option store_fakeip '1'
              option store_cache '1'
              option interface_name 'tor+'
              option proxy_mode 'fake-ip'
              option set_permission '0777'
              option enable_logging '0'
              option log_level 'silent'
              option google_domains_mod '0'
              list enforce_mode '0'
              option tproxy_port '7893'
              option proxy_port '7892'
              option http_port '7892'
              option socks_port '7891'
              option enable_redirect_dns '1'
              option enable_udp_proxy '1'
              option multi_mode 'redir_host'
              option enable_rule_generator '1'
              option ipv6_mode '0'
              option mixed_port '7890'
              option enable_rule_mini '0'
              option enable_custom_clash_proxies '1'
              option enable_meta_core '1'
          EOF

          # 6. 设置 Meta 为默认核心
          mkdir -p rootfs_work/etc/openclash/core
          echo "meta" > rootfs_work/etc/openclash/core/core_version
          echo "meta" > rootfs_work/etc/openclash/core/custom_core_version

          # 7. 重新打包 rootfs
          # 先删除原始文件，再用修改后的版本替换
          rm -f "$ORIGINAL_ROOTFS"
          tar -czf "$ORIGINAL_ROOTFS" -C rootfs_work .
          
          # 清理临时目录
          rm -rf rootfs_work
          
          echo "Mihomo + GEO 注入完成"
          ls -lh "$ORIGINAL_ROOTFS"


      - name: Package armsr as openwrt
        uses: unifreq/openwrt_packit@master
        env:
          OPENWRT_ARMVIRT: openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
          KERNEL_REPO_URL: breakingbadboy/OpenWrt
          KERNEL_VERSION_NAME: 6.6.y
          PACKAGE_SOC: diy
          GZIP_IMGS: .xz
          SCRIPT_DIY_PATH: mk_s905d_n1.sh
          WHOAMI: nantayo
          SW_FLOWOFFLOAD: 0
          SFE_FLOW: 0

      - name: Upload firmware to release
        uses: softprops/action-gh-release@master
        with:
          tag_name: OpenWrt_${{ env.PACKAGED_OUTPUTDATE }}
          files: |
            ${{ env.PACKAGED_OUTPUTPATH }}/*.img.xz
          body: |
            首次使用建议全新刷写
            IP: 192.168.2.5
            账户: root
            密码: password
            
            已内置 Mihomo (Clash Meta) 内核及 GEO 数据库

      - name: Delete old releases
        uses: dev-drprasad/delete-older-releases@master
        with:
          keep_latest: 2
          delete_tags: true
