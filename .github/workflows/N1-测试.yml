name: Build ImmortalWrt-25.12 for N1-TEST

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Free up space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Add swap
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update > /dev/null
          sudo -E apt-get -qq install -y $(curl -fsSL https://raw.githubusercontent.com/nantayo/My-Pkg/master/2410) > /dev/null
          sudo -E apt-get -qq install -y libncurses-dev > /dev/null
          sudo -E apt-get -qq autoremove --purge > /dev/null
          sudo -E apt-get -qq clean > /dev/null
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --depth=1 openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Update & Install feeds
        run: |
          chmod +x diy.sh
          cd openwrt
          ./scripts/feeds update -a
          $GITHUB_WORKSPACE/diy.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load N1 custom config
        run: |
          rm -rf openwrt/files openwrt/.config
          mv files .config openwrt/

      - name: SSH connect to Actions
        uses: P3TERX/ssh2actions@main
        if: github.event.inputs.ssh == 'true'

      - name: Download package
        working-directory: ./openwrt
        run: |
          make defconfig
          make download -j$(( $(nproc) * 2 ))
          find dl -size -1k -exec rm -f {} \;

      - name: Compile N1 firmware
        run: |
          chmod -R 755 openwrt
          cd openwrt
          echo "Use 2 threads for stable build"
          make -j2 --quiet

      - name: Inject Mihomo + GEO (into rootfs)
        run: |
          set -e

          retry_download() {
            local name="$1"
            local cmd="$2"
            local check="$3"
            local max_retry=3
            local i=1

            while [ $i -le $max_retry ]; do
              echo "[$name] 下载尝试 $i/$max_retry ..."
              rm -f tmp_download
              if eval "$cmd" && eval "$check"; then
                echo "[$name] 下载成功"
                return 0
              fi
              i=$((i + 1))
              sleep 2
            done

            echo "❌ 未成功集成 $name ，已重试 $max_retry 次"
            exit 1
          }

          # 1. 找到并保存原始 rootfs 路径
          ORIGINAL_ROOTFS=$(ls -1 openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz | head -n 1)
          echo "Original ROOTFS: $ORIGINAL_ROOTFS"

          rm -rf rootfs_work mihomo_core geo_files
          mkdir -p rootfs_work mihomo_core geo_files
          tar -xzf "$ORIGINAL_ROOTFS" -C rootfs_work

          # 2. 获取最新 Mihomo 版本
          TAG=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | grep tag_name | sed 's/.*"tag_name": "\(.*\)".*/\1/')
          echo "Latest Mihomo tag: $TAG"

          CORE_URL="https://github.com/MetaCubeX/mihomo/releases/download/${TAG}/mihomo-linux-arm64-${TAG}.gz"

          retry_download \
            "Mihomo Meta 内核" \
            "curl -fL \"$CORE_URL\" -o tmp_download && gunzip -c tmp_download > mihomo_core/mihomo" \
            "[ -s mihomo_core/mihomo ]"

          chmod +x mihomo_core/mihomo

          retry_download \
            "GEOIP 数据库" \
            "curl -fL https://raw.githubusercontent.com/Loyalsoldier/geoip/release/geoip.dat -o geo_files/geoip.dat" \
            "[ -s geo_files/geoip.dat ]"

          retry_download \
            "GEOSITE 数据库" \
            "curl -fL https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geosite.dat -o geo_files/geosite.dat" \
            "[ -s geo_files/geosite.dat ]"

          # 3. 安装到 OpenClash 标准路径
          mkdir -p rootfs_work/usr/share/openclash/core
          cp -f mihomo_core/mihomo rootfs_work/usr/share/openclash/core/clash_meta
          chmod +x rootfs_work/usr/share/openclash/core/clash_meta

          cp -f geo_files/geoip.dat rootfs_work/usr/share/openclash/geoip.dat
          cp -f geo_files/geosite.dat rootfs_work/usr/share/openclash/geosite.dat

          mkdir -p rootfs_work/etc/openclash/core
          ln -sf ../usr/share/openclash/geoip.dat rootfs_work/etc/openclash/geoip.dat
          ln -sf ../usr/share/openclash/geosite.dat rootfs_work/etc/openclash/geosite.dat
          ln -sf ../../usr/share/openclash/core/clash_meta rootfs_work/etc/openclash/core/clash_meta

          # 4. 设置 Meta 为默认核心
          echo "meta" > rootfs_work/etc/openclash/core/core_version
          echo "meta" > rootfs_work/etc/openclash/core/custom_core_version

          # 5. 回打包 rootfs
          rm -f "$ORIGINAL_ROOTFS"
          tar -czf "$ORIGINAL_ROOTFS" -C rootfs_work .

          rm -rf rootfs_work mihomo_core geo_files tmp_download

          echo "✅ Mihomo + GEO 已成功注入"
          ls -lh "$ORIGINAL_ROOTFS"


      - name: Package armsr as openwrt
        uses: unifreq/openwrt_packit@master
        env:
          OPENWRT_ARMVIRT: openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
          KERNEL_REPO_URL: breakingbadboy/OpenWrt
          KERNEL_VERSION_NAME: 6.6.y
          PACKAGE_SOC: diy
          GZIP_IMGS: .xz
          SCRIPT_DIY_PATH: mk_s905d_n1.sh
          WHOAMI: nantayo
          SW_FLOWOFFLOAD: 0
          SFE_FLOW: 0

      - name: Upload firmware to release
        uses: softprops/action-gh-release@master
        with:
          tag_name: OpenWrt_${{ env.PACKAGED_OUTPUTDATE }}
          files: |
            ${{ env.PACKAGED_OUTPUTPATH }}/*.img.xz
            openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
          body: |
            首次使用建议全新刷写
            IP: 192.168.2.5
            账户: root
            密码: password
      
            已内置 Mihomo (Clash Meta) 内核及 GEO 数据库
      
            包含 rootfs.tar.gz 便于救砖和定制
              
      - name: Delete old releases
        uses: dev-drprasad/delete-older-releases@master
        with:
          keep_latest: 2
          delete_tags: true
